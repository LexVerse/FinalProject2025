<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search Results - Silver Springs Online Shopping System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./styles.css" rel="stylesheet">
  </head>
  <body>
    
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Silver Springs Supermarket</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <form class="d-flex mx-auto" onsubmit="searchProducts(event)">
            <input class="form-control me-2 flex-grow-1 search-bar" type="search" placeholder="Search" aria-label="Search" id="searchInput">
            <button class="btn btn-outline-light" type="submit">Search</button>
          </form>
          <ul class="navbar-nav ms-auto">
            <!-- ...existing code... -->
          </ul>
          <ul class="navbar-nav ms-auto">
            <!-- ...existing code... -->
          </ul>
          <ul class="navbar-nav ms-auto">
            <!-- ...existing code... -->
          </ul>
        </div>
      </div>
    </nav>

    <!-- Search Results Section -->
    <section class="py-5">
      <div class="container">
        <h2 class="mb-4">Search Results</h2>
        <div class="row row-cols-1 row-cols-md-3 g-4" id="searchResults">
          <!-- Search results will be displayed here -->
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="bg-primary text-white py-4">
      <div class="container text-center">
        <p class="mb-0">© 2025 Silver Springs Supermarket. All Rights Reserved.</p>
      </div>
    </footer>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('query');
        if (query) {
          document.getElementById('searchInput').value = query;
          searchProducts();
        }
      });

      function searchProducts(event) {
        if (event) event.preventDefault();
        const query = document.getElementById('searchInput').value.toLowerCase();
        fetch('./home.html')
          .then(response => response.text())
          .then(html => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const products = doc.querySelectorAll('.card');
            const searchResults = document.getElementById('searchResults');
            searchResults.innerHTML = '';
            products.forEach(product => {
              const title = product.querySelector('.card-title').textContent.toLowerCase();
              const description = product.querySelector('.card-text').textContent.toLowerCase();
              if (title.includes(query) || description.includes(query)) {
                searchResults.appendChild(product.cloneNode(true));
              }
            });
          });
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SSOSS - Register</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-8 col-lg-6">
          <div class="card shadow">
            <div class="card-body">
              <h3 class="card-title text-center mb-4">Create Account</h3>
              <form id="registerForm">
                <div class="mb-3">
                  <label for="fname" class="form-label">First Name</label>
                  <input type="text" class="form-control" id="fname" placeholder="John" required>
                </div>
                <div class="mb-3">
                    <label for="lname" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lname" placeholder="Doe" required>
                  </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Email address</label>
                  <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="password" placeholder="Password" required>
                </div>
                <div class="mb-3">
                  <label for="confirmPassword" class="form-label">Confirm Password</label>
                  <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>
                  <div class="invalid-feedback">
                    Passwords do not match.
                  </div>
                </div>
                <div class="mb-3">
                  <label for="address" class="form-label">Shipping Address</label>
                  <textarea class="form-control" id="address" rows="3" placeholder="Enter your shipping address" required></textarea>
                </div>
                <div class="d-grid">
                  <button id="submit" type="submit" class="btn btn-primary">Register</button>
                </div>
                <div class="mt-3 text-center">
                  <p class="mb-0">Already have an account? <a href="login.html">Login</a></p>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
      document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirmPassword').value;
        
        if (password !== confirmPassword) {
          document.getElementById('confirmPassword').classList.add('is-invalid');
        } else {
          document.getElementById('confirmPassword').classList.remove('is-invalid');
          
          const fname = document.getElementById('fname').value;
          const lname = document.getElementById('lname').value;
          const email = document.getElementById('email').value;
          const address = document.getElementById('address').value;

          fetch('http://localhost:3000/register', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ fname, lname, email, password, address })
          })
          .then(response => response.json())
          .then(data => {
            console.log('Success:', data);
          })
          .catch((error) => {
            console.error('Error:', error);
          });
        }
      });
    </script>
  </body>
</html>
